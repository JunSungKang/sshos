name: Bug report
description: Report a reproducible sshOS defect without private server data.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "For sensitive vulnerabilities follow SECURITY.md. Never post credentials, real endpoints, usernames, paths, private keys, file contents or raw terminal output."
  - type: textarea
    id: environment
    attributes:
      label: Version and environment
      description: App version, source or artifact SHA256, client OS/CPU and isolated server version.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Isolated reproduction
      description: Steps using non-sensitive test data and an authorized fixture.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
      description: Include the fixed error code and last confirmed phase, if available.
    validations:
      required: true
