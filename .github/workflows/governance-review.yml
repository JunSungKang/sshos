name: Current-head App review
on:
  pull_request_target:
    types: [opened, synchronize, reopened, assigned, unassigned, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
permissions:
  contents: read
  pull-requests: read
  statuses: write
jobs:
  governance-review:
    name: governance-review
    runs-on: ubuntu-latest
    steps:
      - name: Verify author, assignee and exact-head App approval without checking out PR code
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          const read = path => JSON.parse(execFileSync('gh', ['api', path], {encoding:'utf8'}));
          const repo=process.env.GH_REPO;
          const pr=read(`repos/${repo}/pulls/${process.env.PR_NUMBER}`);
          const reviews=read(`repos/${repo}/pulls/${pr.number}/reviews?per_page=100`);
          const botReviews=reviews.filter(r=>r.user.login==='junsung-bot[bot]' && r.commit_id===pr.head.sha && r.state!=='COMMENTED');
          const latest=botReviews.sort((a,b)=>b.id-a.id)[0];
          const ok=pr.user.login==='JunSungKang' && pr.assignees.some(a=>a.login==='JunSungKang') && latest?.state==='APPROVED';
          const body=JSON.stringify({state:ok?'success':'failure',context:'current-head-app-review',description:ok?'Exact-head App approval verified':'Human roles or exact-head App approval missing'});
          execFileSync('gh',['api',`repos/${repo}/statuses/${pr.head.sha}`,'--method','POST','--input','-'],{input:body,stdio:['pipe','ignore','inherit']});
          if(!ok)process.exit(1);
          JS
