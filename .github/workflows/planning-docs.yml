name: Planning documents
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  planning-docs:
    name: planning-docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -B docs/validate-plan.py --root "$GITHUB_WORKSPACE"
