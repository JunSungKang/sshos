<text x="1227" y="1166" font-family="Apple SD Gothic Neo, AppleSDGothicNeo, sans-serif" font-size="22" font-weight="400" fill="#C5E4DE">추가 설치 없는 실행 목표 · 별도 관리 서버 없음</text>
<text x="62" y="1230" font-family="Apple SD Gothic Neo, AppleSDGothicNeo, sans-serif" font-size="20" font-weight="400" fill="#526B73">84 ms는 화면 설명용 예시이며 실측값이 아닙니다.</text>
