<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1260" viewBox="0 0 2000 1260" role="img" aria-labelledby="title desc">
<title id="title">sshOS(시오스) v4 시스템 아키텍처</title>
<desc id="desc">프레임워크 결정 전 공통 구조. 사용자 PC의 GUI, 제한된 IPC 경계, 로컬 코어와 비동기 SSH·SFTP 엔진이 기존 Linux 서버에 직접 연결한다. 제품 구현 미착수. SSH 응답 84ms는 예시이며 실측값이 아니다.</desc>
<rect x="0" y="0" width="2000" height="1260" rx="0" fill="#F2F6F5" stroke="none" stroke-width="1.5"/>
<rect x="60" y="53" width="8" height="56" rx="4" fill="#087F78" stroke="none" stroke-width="1.5"/>
<text x="88" y="92" font-family="Apple SD Gothic Neo, AppleSDGothicNeo, sans-serif" font-size="46" font-weight="700" fill="#102F39">sshOS(시오스) v4 시스템 아키텍처</text>
<text x="88" y="137" font-family="Apple SD Gothic Neo, AppleSDGothicNeo, sans-serif" font-size="26" font-weight="400" fill="#526B73">내 PC에서 직접 SSH 연결 · 프레임워크 결정 전 공통 구조</text>
