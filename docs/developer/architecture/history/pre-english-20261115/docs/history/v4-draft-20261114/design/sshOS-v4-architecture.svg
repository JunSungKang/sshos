<text x="119" y="712" font-family="Apple SD Gothic Neo, AppleSDGothicNeo, sans-serif" font-size="25" font-weight="700" fill="#173A44">프로필 · 호스트 키 신뢰 관리</text>
<text x="119" y="754" font-family="Apple SD Gothic Neo, AppleSDGothicNeo, sans-serif" font-size="24" font-weight="400" fill="#173A44">OS 암호화 연계</text>
